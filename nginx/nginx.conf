# ============================================================================
# nginx для bot_vasya: терминирует TLS (опционально), проксирует /api и /webapp
# на api-сервис, раздаёт корневую страницу-заглушку.
#
# HTTPS: положите сертификаты в nginx/certs/ (fullchain.pem, privkey.pem) и
# раскомментируйте блок server(443). Иначе работает только HTTP на :80.
# ============================================================================

# --- HTTP: раздаёт и проксирует, при наличии сертификатов — редирект на HTTPS ---
server {
    listen 80;
    server_name _;

    # Раскомментируйте, если настроен HTTPS:
    # return 301 https://$host$request_uri;

    client_max_body_size 16m;

    # Webhook от Т-Банка и здоровье — обязательно на api
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebApp (собранная статика отдаётся самим FastAPI по /webapp)
    location /webapp/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Корень — простая заглушка
    location / {
        default_type text/plain;
        return 200 "bot_vasya API is running. See /docs (Swagger), /api/..., /webapp/\n";
    }
}

