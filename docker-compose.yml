# ============================================================================
# docker-compose для проекта bot_vasya.
# Сервисы: postgres, redis, rabbitmq, api, bot, nginx.
#
# Запуск:
#   1. cp .env_default .env  &&  заполнить TOKEN/API_ID/API_HASH/TBANK_*/ADMIN_IDS
#   2. docker compose up -d --build
#
# После старта:
#   - API         http://localhost/api  (через nginx)  или  http://localhost:8000
#   - WebApp       http://localhost/webapp/
#   - RabbitMQ UI  http://localhost:15672  (guest/guest)
#
# Внешний домен (для Webhook Т-Банка и Telegram WebApp): укажите WEBAPP_BASE_URL
# и TBANK_NOTIFICATION_URL в .env. HTTPS terminator — nginx (см. nginx/nginx.conf).
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bot_vasya}
      POSTGRES_USER: ${DB_USER:-vasya}
      POSTGRES_PASSWORD: ${DB_PASS:-vasya}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vasya} -d ${DB_NAME:-bot_vasya}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Не экспонируем порт наружу в проде — раскомментируйте для отладки:
    # ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Management UI only for local/dev: docker compose run --service-ports ...
    # ports:
    #   - "15672:15672"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    # Optional edge proxy. On servers with host nginx, omit this profile.
    profiles: ["edge"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginxlogs:/var/log/nginx

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  nginxlogs:
